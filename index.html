<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de bord — Opération Marketing AGPM (Jour 2)</title>
<style>
/* ==========================================================================
   CARNET DE BORD NUMÉRIQUE — Formation « L'IA au service du Marketing » J2
   Adaptation AGPM — Programme Cegos 9585 — Sowaycom
   Charte : bleu marine dominant, accents rouge et blanc, mobile-first.
   ========================================================================== */
:root{
  --marine:#122b4f;        /* bleu marine principal */
  --marine-fonce:#0c1f3a;  /* variante foncée */
  --marine-clair:#1d4377;  /* variante claire */
  --rouge:#b3122e;         /* accent rouge */
  --rouge-clair:#fdecef;   /* fond rouge très pâle */
  --blanc:#ffffff;
  --fond:#f4f6fa;          /* fond général */
  --carte:#ffffff;         /* fond des cartes */
  --texte:#1c2430;         /* texte principal (contraste AA sur blanc) */
  --texte-doux:#4a5568;    /* texte secondaire */
  --bord:#d4dae4;
  --vert:#1e7042;          /* validation */
  --vert-clair:#e7f4ec;
  --or:#a8741a;
  --focus:#1d4377;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--fond);color:var(--texte);line-height:1.55;
}
/* ----- Accessibilité : focus visible au clavier ----- */
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px;border-radius:4px;
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ----- En-tête fixe ----- */
header.appbar{
  position:sticky;top:0;z-index:50;background:var(--marine);color:var(--blanc);
  padding:.65rem 1rem;box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.appbar .ligne1{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.logo-chip{
  background:#fff;border-radius:8px;padding:.2rem .45rem;display:flex;align-items:center;flex:0 0 auto;
}
.logo-chip img{height:30px;width:auto;display:block}
.appbar .badge-op{
  background:var(--rouge);color:#fff;font-weight:700;font-size:.72rem;
  padding:.2rem .55rem;border-radius:99px;letter-spacing:.05em;white-space:nowrap;
}
.appbar h1{font-size:1rem;font-weight:700;flex:1;min-width:200px}
.appbar .qui{font-size:.8rem;opacity:.95}
.btn-export{
  background:#fff;color:var(--marine);border:none;font-weight:700;font-size:.8rem;
  padding:.45rem .8rem;border-radius:6px;cursor:pointer;
}
.btn-export:hover{background:#e8edf5}
/* ----- Barre de progression globale ----- */
.progress-wrap{margin-top:.55rem}
.progress-info{display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:.2rem;opacity:.95}
.progress-bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--rouge),#e0526d);width:0%;transition:width .4s ease;border-radius:99px}

/* ----- Navigation par étapes ----- */
nav.etapes{
  display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 1rem;background:var(--blanc);
  border-bottom:1px solid var(--bord);scrollbar-width:thin;
}
nav.etapes button{
  flex:0 0 auto;border:1.5px solid var(--bord);background:#fff;color:var(--texte-doux);
  font-size:.74rem;font-weight:600;padding:.4rem .7rem;border-radius:99px;cursor:pointer;
  display:flex;align-items:center;gap:.3rem;white-space:nowrap;
}
nav.etapes button.actif{background:var(--marine);border-color:var(--marine);color:#fff}
nav.etapes button.fait{border-color:var(--vert);color:var(--vert)}
nav.etapes button.fait::before{content:"✓ "}
nav.etapes button.verrou{opacity:.45;cursor:not-allowed}
nav.etapes button.verrou::before{content:"🔒 "}

/* ----- Conteneur principal ----- */
main{max-width:880px;margin:0 auto;padding:1.1rem 1rem 4rem}
.carte{
  background:var(--carte);border:1px solid var(--bord);border-radius:12px;
  padding:1.25rem 1.2rem;margin-bottom:1.1rem;box-shadow:0 1px 3px rgba(18,43,79,.06);
}
.etape-entete{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
.horaire{
  background:var(--marine);color:#fff;font-weight:700;font-size:.78rem;
  padding:.22rem .6rem;border-radius:6px;white-space:nowrap;
}
.duree{color:var(--rouge);font-weight:700;font-size:.8rem}
h2{color:var(--marine);font-size:1.3rem;line-height:1.25;margin-bottom:.45rem}
h3{color:var(--marine);font-size:1.02rem;margin:.9rem 0 .4rem}
p{margin-bottom:.6rem}
.objectif{
  background:var(--vert-clair);border-left:4px solid var(--vert);
  padding:.6rem .8rem;border-radius:0 8px 8px 0;margin:.6rem 0;font-size:.92rem;
}
.objectif strong{color:var(--vert)}
ul.consigne{margin:.4rem 0 .8rem 1.2rem}
ul.consigne li{margin-bottom:.45rem}
.note{font-size:.85rem;color:var(--texte-doux);font-style:italic}

/* ----- Brief du cas épinglé ----- */
.rappel-cas{
  border:1.5px dashed var(--marine-clair);border-radius:10px;padding:.7rem .9rem;
  margin:.7rem 0;background:#f7f9fd;font-size:.9rem;
}
.rappel-cas summary{cursor:pointer;font-weight:700;color:var(--marine);list-style:none}
.rappel-cas summary::before{content:"📌 "}
.rappel-cas[open] summary{margin-bottom:.5rem}

/* ----- Encadré prompt ----- */
.prompt-box{
  background:var(--marine-fonce);color:#e9eef7;border-radius:10px;
  padding:.9rem 1rem;margin:.7rem 0;position:relative;
}
.prompt-box .ptitre{
  font-size:.74rem;font-weight:700;letter-spacing:.06em;color:#9db4d8;
  text-transform:uppercase;margin-bottom:.45rem;padding-right:7rem;
}
.prompt-box pre{
  white-space:pre-wrap;word-wrap:break-word;font-family:"Consolas","Menlo",monospace;
  font-size:.84rem;line-height:1.5;
}
.prompt-box mark{
  background:var(--rouge);color:#fff;border-radius:4px;padding:0 .25em;font-weight:700;
}
.btn-copier{
  position:absolute;top:.6rem;right:.6rem;background:var(--rouge);color:#fff;border:none;
  font-size:.74rem;font-weight:700;padding:.35rem .7rem;border-radius:6px;cursor:pointer;
}
.btn-copier:hover{background:#8f0e25}
.btn-copier.ok{background:var(--vert)}

/* ----- Champs de saisie ----- */
label{font-weight:600;font-size:.9rem;display:block;margin:.7rem 0 .25rem;color:var(--marine)}
textarea,input[type=text],input[type=date],input[type=url],input[type=number],select{
  width:100%;border:1.5px solid var(--bord);border-radius:8px;padding:.6rem .7rem;
  font-family:inherit;font-size:.95rem;color:var(--texte);background:#fff;
}
textarea{min-height:130px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--marine-clair)}
.aide-champ{font-size:.78rem;color:var(--texte-doux);margin-top:.15rem}

/* ----- Auto-évaluation ----- */
.autoeval{background:#f7f9fd;border:1px solid var(--bord);border-radius:10px;padding:.8rem .9rem;margin:.8rem 0}
.autoeval legend,.autoeval .titre{font-weight:700;color:var(--marine);font-size:.92rem;margin-bottom:.4rem}
.autoeval label.case{
  display:flex;align-items:flex-start;gap:.55rem;font-weight:400;font-size:.9rem;
  margin:.35rem 0;color:var(--texte);cursor:pointer;
}
.autoeval input[type=checkbox]{width:1.15rem;height:1.15rem;margin-top:.15rem;accent-color:var(--marine);flex:0 0 auto}

/* ----- Quiz ----- */
.question{border:1px solid var(--bord);border-radius:10px;padding:.85rem .95rem;margin:.7rem 0;background:#fff}
.question .qtitre{font-weight:700;margin-bottom:.55rem}
.reponses{display:flex;flex-direction:column;gap:.4rem}
.reponses button{
  text-align:left;border:1.5px solid var(--bord);background:#fff;border-radius:8px;
  padding:.55rem .7rem;font-size:.92rem;cursor:pointer;font-family:inherit;color:var(--texte);
}
.reponses button:hover:not(:disabled){border-color:var(--marine-clair);background:#f4f7fc}
.reponses button:disabled{cursor:default}
.reponses button.bonne{border-color:var(--vert);background:var(--vert-clair);font-weight:700}
.reponses button.mauvaise{border-color:var(--rouge);background:var(--rouge-clair)}
.feedback{font-size:.86rem;margin-top:.5rem;padding:.5rem .7rem;border-radius:8px;display:none}
.feedback.visible{display:block}
.feedback.vrai{background:var(--vert-clair);color:var(--vert)}
.feedback.faux{background:var(--rouge-clair);color:var(--rouge)}
.score-final{
  text-align:center;background:var(--marine);color:#fff;border-radius:10px;
  padding:1rem;margin:.8rem 0;font-size:1.05rem;font-weight:700;
}

/* ----- Choix du cas ----- */
.cas-grille{display:grid;grid-template-columns:1fr;gap:.8rem;margin:.8rem 0}
@media(min-width:680px){.cas-grille{grid-template-columns:repeat(3,1fr)}}
.cas-choix{
  border:2px solid var(--bord);border-radius:12px;padding:.9rem;background:#fff;
  cursor:pointer;text-align:left;font-family:inherit;transition:transform .12s;
}
.cas-choix:hover{transform:translateY(-2px);border-color:var(--marine-clair)}
.cas-choix.choisi{border-color:var(--rouge);box-shadow:0 0 0 3px var(--rouge-clair)}
.cas-choix .embleme{font-size:1.7rem}
.cas-choix h3{margin:.3rem 0 .25rem;font-size:1rem}
.cas-choix p{font-size:.82rem;color:var(--texte-doux);margin:0}
.brief-complet{background:#f7f9fd;border:1.5px solid var(--marine-clair);border-radius:12px;padding:1rem;margin-top:.8rem}
.brief-complet h3{margin-top:0}
.brief-complet dt{font-weight:700;color:var(--marine);margin-top:.5rem}
.brief-complet dd{margin-left:0}

/* ----- Grille jury ----- */
table.jury{width:100%;border-collapse:collapse;margin:.6rem 0;font-size:.9rem}
table.jury th,table.jury td{border:1px solid var(--bord);padding:.5rem .6rem;text-align:left}
table.jury th{background:var(--marine);color:#fff;font-size:.82rem}
table.jury input[type=number]{width:4.5rem;text-align:center}
.total-jury{font-size:1.1rem;font-weight:700;color:var(--marine);text-align:right;margin:.4rem 0}

/* ----- Boutons d'action ----- */
.zone-boutons{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}
.btn{
  border:none;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;
  padding:.7rem 1.3rem;font-family:inherit;
}
.btn-principal{background:var(--rouge);color:#fff}
.btn-principal:hover{background:#8f0e25}
.btn-principal:disabled{background:#c9ced8;cursor:not-allowed}
.btn-secondaire{background:#fff;color:var(--marine);border:1.5px solid var(--marine)}
.btn-secondaire:hover{background:#eef2f8}
.confirmation{
  display:none;background:var(--vert-clair);color:var(--vert);font-weight:700;
  padding:.55rem .8rem;border-radius:8px;margin-top:.6rem;font-size:.9rem;
}
.confirmation.visible{display:block}

/* ----- Accueil ----- */
.agenda{width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0}
.agenda td{border-bottom:1px solid var(--bord);padding:.4rem .5rem;vertical-align:top}
.agenda td:first-child{font-weight:700;color:var(--marine);white-space:nowrap;width:5.2rem}
.banniere-fin{
  background:linear-gradient(135deg,var(--marine),var(--marine-clair));color:#fff;
  border-radius:12px;padding:1.4rem;text-align:center;margin:.8rem 0;
}
.banniere-fin .gros{font-size:1.5rem;font-weight:800;margin-bottom:.4rem}

/* ----- Impression : seul le récapitulatif s'imprime ----- */
#zone-impression{display:none}
@media print{
  body *{visibility:hidden}
  #zone-impression,#zone-impression *{visibility:visible}
  #zone-impression{
    display:block;position:absolute;top:0;left:0;width:100%;
    font-size:11pt;color:#000;background:#fff;padding:0;
  }
  #zone-impression h1{font-size:16pt;color:#122b4f;margin-bottom:4pt}
  #zone-impression h2{font-size:13pt;color:#122b4f;border-bottom:1.5pt solid #b3122e;padding-bottom:2pt;margin:12pt 0 6pt;page-break-after:avoid}
  #zone-impression h3{font-size:11.5pt;margin:8pt 0 3pt}
  #zone-impression .bloc-livrable{border:1pt solid #999;border-radius:4pt;padding:6pt;margin:4pt 0;white-space:pre-wrap;page-break-inside:avoid}
  #zone-impression .meta{color:#444;font-style:italic;margin-bottom:8pt}
  #zone-impression ul{margin-left:14pt}
}
</style>
</head>

   Aucune donnée n'est envoyée à un serveur : tout reste dans le navigateur.

const CLE_STOCKAGE = "carnet_agpm_j2_v1";

const etatParDefaut = () => ({
  prenom: "", escouade: "", cas: "",
  unlocked: 0,                  // index max d'étape accessible
  done: {},                     // { numéroÉtape: true }
  quiz1: {}, quizMidi: {},      // { indexQuestion: indexRéponseChoisie }
  champs: {},                   // toutes les saisies texte/checkbox { clé: valeur }
  jury: {}                      // notes auto-évaluation du pitch { index: nombre }
});

let etat = chargerEtat();
let etapeCourante = Math.min(etat.unlocked, 14);

function chargerEtat() {
  try {
    const brut = localStorage.getItem(CLE_STOCKAGE);
    if (brut) return Object.assign(etatParDefaut(), JSON.parse(brut));
  } catch (e) { /* stockage indisponible ou corrompu : on repart à zéro */ }
  return etatParDefaut();
}
function sauvegarder() {
  try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(etat)); } catch (e) { /* quota plein : on continue sans bloquer */ }
  majProgression();
  majNav();
}

/* ----- Aides ----- */
function echapper(t) {
  return String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function $(sel, racine) { return (racine || document).querySelector(sel); }
function $$(sel, racine) { return Array.from((racine || document).querySelectorAll(sel)); }

/* Substitue {variable:cle} par la donnée du cas choisi ; surligne le reste. */
function preparerPrompt(modele, pourHtml) {
  const cas = CAS[etat.cas];
  let txt = modele;
  if (cas) {
    txt = txt.replace(/\{variable:nomcas\}/g, cas.nom)
             .replace(/\{variable:produit\}/g, cas.produit)
             .replace(/\{variable:cible\}/g, cas.cible)
             .replace(/\{variable:objectif\}/g, cas.objectif)
             .replace(/\{variable:ton\}/g, cas.ton);
  } else {
    txt = txt.replace(/\{variable:(\w+)\}/g, "{$1 — choisissez d'abord votre cas}");
  }
  if (!pourHtml) return txt; // version texte brut pour le presse-papiers
  return echapper(txt).replace(/\{([^}]+)\}/g, "<mark>{$1}</mark>");
}

/* Copie dans le presse-papiers avec solution de repli (navigateurs anciens). */
function copierTexte(texte, bouton) {
  const ok = () => {
    bouton.classList.add("ok"); bouton.textContent = "✓ Copié !";
    setTimeout(() => { bouton.classList.remove("ok"); bouton.textContent = "Copier le prompt"; }, 2200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texte).then(ok).catch(() => replis());
  } else { replis(); }
  function replis() {
    const ta = document.createElement("textarea");
    ta.value = texte; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) { alert("Copie impossible : sélectionnez le texte manuellement."); }
    document.body.removeChild(ta);
  }
}

/* ==========================================================================
   PROGRESSION & NAVIGATION
   ========================================================================== */
function nbEtapesFaites() { return ETAPES.filter(e => etat.done[e.id]).length; }

function majProgression() {
  const pct = Math.round(nbEtapesFaites() / ETAPES.length * 100);
  $("#progress-fill").style.width = pct + "%";
  $("#progress-texte").textContent = pct + " % — " + nbEtapesFaites() + "/" + ETAPES.length + " étapes";
  $("#progress-aria").setAttribute("aria-valuenow", pct);
  const ident = [];
  if (etat.prenom) ident.push(etat.prenom);
  if (etat.escouade) ident.push("Escouade " + etat.escouade);
  if (etat.cas && CAS[etat.cas]) ident.push(CAS[etat.cas].embleme + " " + CAS[etat.cas].nom);
  $("#affichage-identite").textContent = ident.join(" · ");
}

function majNav() {
  const nav = $("#nav-etapes");
  nav.innerHTML = "";
  ETAPES.forEach(e => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = e.nav;
    const verrouille = e.id > etat.unlocked;
    if (verrouille) { b.classList.add("verrou"); b.setAttribute("aria-disabled", "true"); b.title = "Étape verrouillée : terminez d'abord les étapes précédentes."; }
    if (etat.done[e.id]) b.classList.add("fait");
    if (e.id === etapeCourante) { b.classList.add("actif"); b.setAttribute("aria-current", "step"); }
    b.addEventListener("click", () => { if (!verrouille) afficherEtape(e.id); });
    nav.appendChild(b);
  });
}

function afficherEtape(n) {
  etapeCourante = n;
  rendre(n);
  majNav();
  window.scrollTo({ top: 0, behavior: "smooth" });
  $("#contenu").focus({ preventScroll: true });
}

/* Bouton de validation générique : marque l'étape faite et déverrouille la suivante. */
function validerEtape(n, messageId) {
  etat.done[n] = true;
  etat.unlocked = Math.max(etat.unlocked, Math.min(n + 1, 14));
  sauvegarder();
  if (messageId) { const m = $("#" + messageId); if (m) m.classList.add("visible"); }
}

/* ==========================================================================
   GABARITS COMMUNS
   ========================================================================== */
function enteteEtape(e, titreForce) {
  return '<div class="etape-entete">' +
    '<span class="horaire">' + echapper(e.horaire) + '</span>' +
    (e.duree ? '<span class="duree">' + echapper(e.duree) + '</span>' : "") +
    '</div><h2>' + echapper(titreForce || e.titre) + "</h2>";
}
function rappelCas() {
  const c = CAS[etat.cas];
  if (!c) return "";
  return '<details class="rappel-cas"><summary>Rappel de votre brief — ' + echapper(c.nom) + "</summary>" +
    "<p><strong>Contexte :</strong> " + echapper(c.contexte) + "</p>" +
    "<p><strong>Cible :</strong> " + echapper(c.cible) + "</p>" +
    "<p><strong>Objectif :</strong> " + echapper(c.objectif) + "</p>" +
    "<p><strong>Ton :</strong> " + echapper(c.ton) + "</p>" +
    "<p><strong>Ressources :</strong> " + echapper(c.ressources) + "</p></details>";
}
function champTexte(cle, label, type, aide) {
  const val = echapper(etat.champs[cle] || "");
  const id = "champ_" + cle;
  let html = '<label for="' + id + '">' + echapper(label) + "</label>";
  if (type === "court") html += '<input type="text" id="' + id + '" data-cle="' + cle + '" value="' + val + '">';
  else html += '<textarea id="' + id + '" data-cle="' + cle + '">' + val + "</textarea>";
  if (aide) html += '<p class="aide-champ">' + echapper(aide) + "</p>";
  return html;
}
function casesAutoEval(prefixe, criteres, titre) {
  let html = '<fieldset class="autoeval"><legend>' + echapper(titre || "Auto-évaluation — cochez ce qui est vrai pour votre livrable") + "</legend>";
  criteres.forEach((c, i) => {
    const cle = prefixe + "_crit" + i;
    const coche = etat.champs[cle] ? " checked" : "";
    html += '<label class="case"><input type="checkbox" data-cle="' + cle + '"' + coche + "><span>" + echapper(c) + "</span></label>";
  });
  return html + "</fieldset>";
}

/* ==========================================================================
   QUIZ — rendu et logique (feedback immédiat, score, rejouer)
   ========================================================================== */
function rendreQuiz(quiz, cleQuiz, etapeNum) {
  const zoneQ = $("#zone-quiz");
  zoneQ.innerHTML = quiz.map((q, i) => {
    const repondu = etat[cleQuiz][i];
    return '<div class="question" data-q="' + i + '"><p class="qtitre">' + (i + 1) + ". " + echapper(q.q) + "</p>" +
      '<div class="reponses" role="group" aria-label="Réponses question ' + (i + 1) + '">' +
      q.r.map((r, j) => {
        let cls = "";
        if (repondu != null) {
          if (j === q.bonne) cls = "bonne";
          else if (j === repondu) cls = "mauvaise";
        }
        return '<button type="button" class="' + cls + '" data-q="' + i + '" data-r="' + j + '"' + (repondu != null ? " disabled" : "") + ">" + echapper(r) + "</button>";
      }).join("") + "</div>" +
      '<p class="feedback ' + (repondu != null ? "visible " + (repondu === q.bonne ? "vrai" : "faux") : "") + '" id="fb-' + i + '" role="status">' +
      (repondu != null ? (repondu === q.bonne ? "✅ Exact ! " : "❌ Pas tout à fait. ") + echapper(q.fb) : "") + "</p></div>";
  }).join("");

  function majScore() {
    const reponses = Object.keys(etat[cleQuiz]).length;
    if (reponses === quiz.length) {
      let score = 0;
      quiz.forEach((q, i) => { if (etat[cleQuiz][i] === q.bonne) score++; });
      const sf = $("#score-final");
      sf.style.display = "block";
      const com = score === quiz.length ? "Sans faute, impressionnant !" :
        score >= quiz.length * 0.7 ? "Très solide — les bases sont là." :
        "L'essentiel est de réactiver : relisez les corrections, elles resserviront toute la journée.";
      sf.textContent = "Votre score : " + score + " / " + quiz.length + " — " + com;
      $("#btn-valider-quiz").disabled = false;
    }
  }
  majScore();

  zoneQ.addEventListener("click", ev => {
    const b = ev.target.closest("button[data-r]");
    if (!b || b.disabled) return;
    const i = +b.dataset.q, j = +b.dataset.r;
    etat[cleQuiz][i] = j;
    sauvegarder();
    const bloc = b.closest(".question");
    $$("button[data-r]", bloc).forEach(x => {
      x.disabled = true;
      const xj = +x.dataset.r;
      if (xj === quiz[i].bonne) x.classList.add("bonne");
      else if (xj === j) x.classList.add("mauvaise");
    });
    const fb = $("#fb-" + i);
    fb.classList.add("visible", j === quiz[i].bonne ? "vrai" : "faux");
    fb.textContent = (j === quiz[i].bonne ? "✅ Exact ! " : "❌ Pas tout à fait. ") + quiz[i].fb;
    majScore();
  });

  $("#btn-rejouer").addEventListener("click", () => {
    etat[cleQuiz] = {};
    sauvegarder();
    rendre(etapeNum);
  });
  $("#btn-valider-quiz").addEventListener("click", () => {
    validerEtape(etapeNum, "conf-quiz");
  });
}

/* ==========================================================================
   BRANCHEMENT DES ÉVÉNEMENTS PAR ÉTAPE
   ========================================================================== */
function brancherEvenements(n) {
  const zone = $("#contenu");

  /* Étape 0 : démarrage */
  const bd = $("#btn-demarrer");
  if (bd) bd.addEventListener("click", () => {
    if (!etat.prenom || !etat.escouade) {
      alert("Indiquez votre prénom et le nom de votre escouade pour commencer — c'est votre carnet, il doit porter vos couleurs !");
      return;
    }
    validerEtape(0, "conf-0");
    setTimeout(() => afficherEtape(1), 600);
  });

  /* Étape 2 : choix du cas */
  $$(".cas-choix", zone).forEach(b => b.addEventListener("click", () => {
    etat.cas = b.dataset.cas;
    sauvegarder();
    $$(".cas-choix", zone).forEach(x => { x.classList.toggle("choisi", x === b); x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    $("#btn-valider-cas").disabled = false;
    afficherBrief();
  }));
  function afficherBrief() {
    const zb = $("#zone-brief"); if (!zb) return;
    const c = CAS[etat.cas];
    zb.innerHTML = !c ? "" : '<div class="brief-complet"><h3>' + c.embleme + " " + echapper(c.nom) + " — " + echapper(c.accroche) + "</h3><dl>" +
      "<dt>Contexte</dt><dd>" + echapper(c.contexte) + "</dd>" +
      "<dt>Cible</dt><dd>" + echapper(c.cible) + "</dd>" +
      "<dt>Objectif business</dt><dd>" + echapper(c.objectif) + "</dd>" +
      "<dt>Ton</dt><dd>" + echapper(c.ton) + "</dd>" +
      "<dt>Ressources agpm.fr</dt><dd>" + echapper(c.ressources) + "</dd></dl></div>";
  }
  if (n === 2) afficherBrief();
  const bvc = $("#btn-valider-cas");
  if (bvc) bvc.addEventListener("click", () => { if (etat.cas) validerEtape(2, "conf-2"); });

  /* Boutons « copier le prompt » */
  $$(".btn-copier", zone).forEach(b => b.addEventListener("click", () => {
    const m = MISSIONS.find(x => x.id === b.dataset.mission);
    if (m) copierTexte(preparerPrompt(m.prompt, false), b);
  }));

  /* Validation d'une mission : au moins le premier livrable doit être rempli. */
  $$("[data-valide-mission]", zone).forEach(b => b.addEventListener("click", () => {
    const num = +b.dataset.valideMission;
    const m = MISSIONS.find(x => x.etape === num);
    const premier = etat.champs[m.livrables[0].cle];
    if (!premier || !premier.trim()) {
      alert("Collez d'abord votre livrable principal : c'est lui qui alimentera votre pitch final !");
      return;
    }
    validerEtape(num, "conf-" + num);
  }));

  /* Validations simples (fails, pitch, plan d'action) */
  $$("[data-valide-simple]", zone).forEach(b => b.addEventListener("click", () => {
    const num = +b.dataset.valideSimple;
    validerEtape(num, "conf-" + num);
  }));

  /* Étape 12 : total jury */
  if (n === 12) majTotalJury();

  /* Étape 14 : clôture */
  const bt = $("#btn-terminer");
  if (bt) bt.addEventListener("click", () => {
    validerEtape(14);
    $("#banniere-fin").style.display = "block";
    $("#banniere-fin").scrollIntoView({ behavior: "smooth" });
  });

  /* Boutons export secondaires */
  ["btn-export-2", "btn-export-3"].forEach(id => { const b2 = $("#" + id); if (b2) b2.addEventListener("click", exporterCarnet); });
}

/* Total de la grille jury (étape 12) — fonction globale. */
function majTotalJury() {
  const t = $("#total-jury"); if (!t) return;
  let total = 0, max = 0, saisi = false;
  GRILLE_JURY.forEach((g, i) => { max += g.max; if (etat.jury[i] != null) { total += etat.jury[i]; saisi = true; } });
  t.textContent = saisi ? "Total auto-évaluation : " + total + " / " + max : "Renseignez vos notes pour calculer le total.";
}

/* ==========================================================================
   EXPORT / IMPRESSION — récapitulatif propre de tout le carnet
   ========================================================================== */
function exporterCarnet() {
  const z = $("#zone-impression");
  const c = CAS[etat.cas];
  const date = new Date().toLocaleDateString("fr-FR", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  /* Logo AGPM en tête du récapitulatif imprimé (réutilise le data URI de l'en-tête). */
  const logoEl = document.getElementById("logo-agpm");
  let h = (logoEl ? '<img src="' + logoEl.src + '" alt="Logo AGPM" style="height:46px;margin-bottom:8pt">' : "") +
    "<h1>Carnet de bord — Opération Marketing AGPM (Jour 2)</h1>" +
    '<p class="meta">Formation « L\'IA au service du Marketing » (Cegos 9585, adaptation AGPM) — ' + echapper(date) + "<br>" +
    "Apprenant·e : <strong>" + echapper(etat.prenom || "—") + "</strong> · Escouade : <strong>" + echapper(etat.escouade || "—") + "</strong>" +
    (c ? " · Cas : <strong>" + echapper(c.nom) + "</strong>" : "") + " · Progression : " + nbEtapesFaites() + "/" + ETAPES.length + " étapes</p>";

  function bloc(titre, contenu) {
    if (!contenu || !String(contenu).trim()) return "";
    return "<h3>" + echapper(titre) + '</h3><div class="bloc-livrable">' + echapper(contenu) + "</div>";
  }
  function scoreQuiz(quiz, reponses) {
    const nb = Object.keys(reponses).length;
    if (!nb) return "Non réalisé.";
    let s = 0; quiz.forEach((q, i) => { if (reponses[i] === q.bonne) s++; });
    return "Score : " + s + " / " + quiz.length + (nb < quiz.length ? " (quiz incomplet)" : "");
  }

  h += "<h2>Quiz d'accueil « Le débriefing » (09h00)</h2><p>" + scoreQuiz(QUIZ_J1, etat.quiz1) + "</p>";
  if (c) h += "<h2>Mon cas fil rouge</h2><p><strong>" + echapper(c.nom) + "</strong> — " + echapper(c.accroche) + "</p>";

  MISSIONS.forEach(m => {
    let corps = "";
    m.livrables.forEach(l => { corps += bloc(l.label, etat.champs[l.cle]); });
    const coches = m.criteres.filter((cr, i) => etat.champs[m.id + "_crit" + i]);
    if (coches.length) corps += "<h3>Auto-évaluation validée</h3><ul>" + coches.map(x => "<li>" + echapper(x) + "</li>").join("") + "</ul>";
    if (corps) h += "<h2>" + echapper(m.titre) + " (" + m.horaire + ")</h2>" + corps;
  });

  h += "<h2>Quiz éclair « Le rapport du midi » (13h30)</h2><p>" + scoreQuiz(QUIZ_MIDI, etat.quizMidi) + "</p>";

  let fails = "";
  FAILS.forEach((f, i) => { fails += bloc("Affaire « " + f.titre + " » — ma plaidoirie", etat.champs["fail" + i]); });
  if (fails) h += "<h2>Le tribunal des fails (16h10)</h2>" + fails;

  const cochesPitch = CHECKLIST_PITCH.filter((cr, i) => etat.champs["pitch_crit" + i]);
  let pitch = "";
  if (cochesPitch.length) pitch += "<h3>Check-list de cohérence validée</h3><ul>" + cochesPitch.map(x => "<li>" + echapper(x) + "</li>").join("") + "</ul>";
  let totalJ = 0, maxJ = 0, saisiJ = false;
  GRILLE_JURY.forEach((g, i) => { maxJ += g.max; if (etat.jury[i] != null) { totalJ += etat.jury[i]; saisiJ = true; } });
  if (saisiJ) pitch += "<p><strong>Auto-évaluation grille jury : " + totalJ + " / " + maxJ + "</strong></p>";
  pitch += bloc("Mes notes de pitch", etat.champs["pitch_notes"]);
  if (pitch) h += "<h2>Pitch final (16h30)</h2>" + pitch;

  let plan = "";
  [["1", "Semaine 1"], ["2", "Semaines 2-3"], ["3", "Semaine 4"]].forEach(p => {
    const eng = etat.champs["plan" + p[0] + "_engagement"];
    if (eng && eng.trim()) {
      plan += "<h3>" + p[1] + "</h3><div class=\"bloc-livrable\">" + echapper(eng) +
        "\nOutil : " + echapper(etat.champs["plan" + p[0] + "_outil"] || "—") +
        "\nIndicateur : " + echapper(etat.champs["plan" + p[0] + "_indicateur"] || "—") + "</div>";
    }
  });
  if (etat.champs["plan_binome"] || etat.champs["plan_date"]) {
    plan += "<p>Binôme de redevabilité : <strong>" + echapper(etat.champs["plan_binome"] || "—") +
      "</strong> · Point J+30 : <strong>" + echapper(etat.champs["plan_date"] || "—") + "</strong></p>";
  }
  if (plan) h += "<h2>Plan d'action 30 jours</h2>" + plan;

  let evalq = bloc("Quiz Learning Hub", etat.champs["lien_hub"]) + bloc("Questionnaire de satisfaction", etat.champs["lien_satisfaction"]) + bloc("Mon objectif personnel est-il atteint ?", etat.champs["objectif_atteint"]);
  if (evalq) h += "<h2>Évaluations Qualiopi</h2>" + evalq;

  h += '<p class="meta">Document généré localement par le carnet de bord numérique — aucune donnée n\'a quitté ce navigateur (RGPD).</p>';
  z.innerHTML = h;
  window.print();
}

/* ==========================================================================
   INITIALISATION
   ========================================================================== */
(function init() {
  /* Pré-remplir prénom/escouade depuis l'état (champs de l'étape 0). */
  etat.champs["prenom_tmp"] = etat.prenom;
  etat.champs["escouade_tmp"] = etat.escouade;
  $("#btn-export").addEventListener("click", exporterCarnet);

  /* Sauvegarde automatique de TOUTES les saisies (délégation attachée UNE fois). */
  $("#contenu").addEventListener("input", ev => {
    const el = ev.target;
    if (!el.dataset) return;
    if (el.dataset.cle) {
      etat.champs[el.dataset.cle] = el.type === "checkbox" ? (el.checked ? "1" : "") : el.value;
      if (el.dataset.cle === "prenom_tmp") etat.prenom = el.value.trim();
      if (el.dataset.cle === "escouade_tmp") etat.escouade = el.value.trim();
      sauvegarder();
    }
    if (el.dataset.jury != null) {
      const i = +el.dataset.jury;
      let v = parseFloat(el.value);
      const max = GRILLE_JURY[i].max;
      if (isNaN(v)) { delete etat.jury[i]; }
      else { v = Math.max(0, Math.min(max, v)); el.value = v; etat.jury[i] = v; }
      sauvegarder();
      majTotalJury();
    }
  });
  majProgression();
  majNav();
  rendre(etapeCourante);
})();
</script>
</body>
</html>
